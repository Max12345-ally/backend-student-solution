[project]
name = "backend-student-solution"
version = "0.1.0"
description = "Учебный бэкенд магазина электроники"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.10.6",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["shop"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
